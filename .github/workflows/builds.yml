name: Controller checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Exercise full installation and rollback with synthetic files
        run: python -m unittest discover -s tests -p test_full_installer.py -v
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test motion math and ABI (no game data)
        run: |
          mkdir -p build
          cc tests/test_motion.c -lm -o build/test_motion
          build/test_motion
          cc tests/test_hd_wire.c -o build/test_hd_wire
          build/test_hd_wire
          cc tests/test_present_policy.c -o build/test_present_policy
          build/test_present_policy
          cc tests/test_settings_profile.c runtime/settings.c -lm -o build/test_settings_profile
          profile=$(mktemp)
          ODYSSEY_SETTINGS="$profile" build/test_settings_profile seed
          ODYSSEY_SETTINGS="$profile" build/test_settings_profile recover
      - name: Reject proprietary/generated payload paths
        run: |
          python3 - <<'PY'
          import subprocess,re
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          forbidden=r'(^|/)(extracted|generated[^/]*|romfs|exefs|save|screenshots)/|\.(nsp|xci|nca|nso|nsz|xcz|npdm|keys)$|(^|/)(prod\.keys|title\.keys|odyssey_game\.(dll|so|dylib))$'
          bad=[p for p in files if re.search(forbidden,p,re.I)]
          assert not bad,bad
          print('Source content audit: PASS')
          PY
